##
## Left UR3e + left Allegro combined robot config (22 DOF: 6 arm + 16 hand).
## URDF uses `la_` prefix on every link and joint.
##

robot_cfg:
  kinematics:
    use_root_pose: False
    hand_pose_transfer_path: "hand_pose_transfer/allegro.yml"
    grad_group_names: [
      ['la_shoulder_pan_joint', 'la_shoulder_lift_joint', 'la_elbow_joint',
        'la_wrist_1_joint', 'la_wrist_2_joint', 'la_wrist_3_joint'],
      ['la_joint_0_0', 'la_joint_1_0', 'la_joint_2_0', 'la_joint_3_0',
        'la_joint_4_0', 'la_joint_5_0', 'la_joint_6_0', 'la_joint_7_0',
        'la_joint_8_0', 'la_joint_9_0', 'la_joint_10_0', 'la_joint_11_0',
        'la_joint_12_0', 'la_joint_13_0', 'la_joint_14_0', 'la_joint_15_0']
    ]
    tendon_joints: []

    urdf_path: "robot/ur_description/la_ur3e_allegro_overhead.urdf"
    asset_root_path: "robot/ur_description"

    base_link: "world"
    ee_link: "la_palm_link"
    link_names: ["la_link_3_0_tip", "la_link_7_0_tip", "la_link_11_0_tip", "la_link_15_0_tip"]
    lock_joints: null
    extra_links: null

    collision_link_names: [
        "la_shoulder_link",
        "la_upper_arm_link",
        "la_forearm_link",
        "la_wrist_1_link",
        "la_wrist_2_link",
        "la_wrist_3_link",

        "la_palm_link",
        "la_link_1_0",
        "la_link_2_0",
        "la_link_3_0",
        "la_link_3_0_tip",
        "la_link_5_0",
        "la_link_6_0",
        "la_link_7_0",
        "la_link_7_0_tip",
        "la_link_9_0",
        "la_link_10_0",
        "la_link_11_0",
        "la_link_11_0_tip",
        "la_link_12_0",
        "la_link_13_0",
        "la_link_14_0",
        "la_link_15_0",
        "la_link_15_0_tip",
      ]
    collision_spheres: "spheres/la_ur3e_allegro.yml"
    collision_sphere_buffer: 0.00
    extra_collision_spheres: {}
    self_collision_ignore: {
      'la_shoulder_link':    ['la_upper_arm_link'],
      'la_upper_arm_link':   ['la_forearm_link'],
      'la_forearm_link':     ['la_wrist_1_link'],
      'la_wrist_1_link':     ['la_wrist_2_link'],
      'la_wrist_2_link':     ['la_wrist_3_link'],
      'la_wrist_3_link':     ['la_palm_link'],
      'la_palm_link':        ['la_link_1_0', 'la_link_5_0', 'la_link_9_0', 'la_link_12_0'],
      'la_link_1_0':         ['la_link_2_0'],
      'la_link_2_0':         ['la_link_3_0'],
      'la_link_3_0':         ['la_link_3_0_tip'],
      'la_link_5_0':         ['la_link_6_0'],
      'la_link_6_0':         ['la_link_7_0'],
      'la_link_7_0':         ['la_link_7_0_tip'],
      'la_link_9_0':         ['la_link_10_0'],
      'la_link_10_0':        ['la_link_11_0'],
      'la_link_11_0':        ['la_link_11_0_tip'],
      'la_link_12_0':        ['la_link_13_0', 'la_link_14_0'],
      'la_link_13_0':        ['la_link_14_0'],
      'la_link_14_0':        ['la_link_15_0'],
      'la_link_15_0':        ['la_link_15_0_tip'],
    }
    self_collision_buffer:
      la_shoulder_link: 0.0
      la_upper_arm_link: 0.0
      la_forearm_link: 0.0
      la_wrist_1_link: 0.0
      la_wrist_2_link: 0.0
      la_wrist_3_link: 0.0
      la_palm_link: 0.0
      la_link_1_0: 0.0
      la_link_2_0: 0.0
      la_link_3_0: 0.002
      la_link_3_0_tip: 0.0
      la_link_5_0: 0.0
      la_link_6_0: 0.0
      la_link_7_0: 0.002
      la_link_7_0_tip: 0.0
      la_link_9_0: 0.0
      la_link_10_0: 0.0
      la_link_11_0: 0.002
