         -0.32724924,  -2.41967113,  -1.73817069,   1.01176800,   1.13237067,   2.40280778,
          0.0, 0.7242903113365173, 0.7242903113365173, 0.7242903113365173,
          0.0, 0.7242903113365173, 0.7242903113365173, 0.7242903113365173,
